# ROTEIRO FINAL - ENTER x OAB (v3)
# Usa as FOTOS REAIS que você colou
# Remove duplicações de forma agressiva

video: entrada/Enter x OAB/D6EB16CD-BAC0-4026-B71D-E318BD41CF0E.mp4
saida: saida/Enter_x_OAB_FINAL_v3.mp4

tema:
  fundo: ["#0a0e27", "#1a1f3a"]
  destaque: "#d4af37"
  secundaria: "#c0c0c0"

legendas:
  ativas: true
  estilo: destaque
  palavras_por_bloco: 3
  substituicoes:
    enter: ENTER
    oab: OAB
    ia: IA

divisao:
  proporcao: 0.45
  animacao_em: cima
  foco_rosto: 0.58
  transicao: 0.35

eventos:
  # ============================================================================
  # HOOK IMPACTANTE (0-2.5s)
  # ============================================================================
  - em: "0:00"
    duracao: 1.5
    layout: cheio
    animacao:
      tipo: texto
      texto: "UMA STARTUP DE IA PROCESSADA PELA OAB"
      subtitulo: "A disputa que vai além da tecnologia"
      tamanho: 120

  # ============================================================================
  # APRESENTAÇÃO COM FOTOS REAIS
  # ============================================================================

  # Logo ENTER + OAB (foto real após hook)
  - quando: "startup brasileira de A jurídica"
    ate_quando: "1,2 bilhões de dólares"
    duracao: 4
    animacao:
      tipo: texto
      texto: "ENTER"
      subtitulo: "Unicórnio de IA Jurídica | Avaliação: 1,2 BI"
      emoji: "⚖️"
      tamanho: 140

  # Clientes da ENTER (foto real) - REMOVIDO para encurtar vídeo

  # ============================================================================
  # COMO FUNCIONA - FLUXO REAL
  # ============================================================================

  - quando: "Um agente que lê"
    ate_quando: "e o protocolo"
    duracao: 3
    animacao:
      tipo: passos
      titulo: "FLUXO REAL DA ENTER"
      numerada: true
      itens:
        - texto: "Agente lê e organiza"
        - texto: "Propõe a tese"
        - texto: "Escreve minuta"
        - texto: "Advogado assina"

  # Estatística real
  - quando: "70% dos processos"
    ate_quando: "84 mil minutas"
    duracao: 3
    animacao:
      tipo: comparacao
      titulo: "ESCALA LATAM"
      esquerda:
        titulo: "70%"
        itens: ["Processos com", "sugestão de minuta"]
      direita:
        titulo: "84K"
        itens: ["Minutas por ano", "no Brasil"]

  # ============================================================================
  # A AÇÃO DA OAB (SEM REPETIÇÃO)
  # ============================================================================

  - quando: "OAB de São Paulo ajuizou"
    duracao: 1.5
    animacao:
      tipo: texto
      texto: "AÇÃO CIVIL PÚBLICA"
      subtitulo: "7 de outubro de 2024"
      emoji: "⚖️"
      tamanho: 130

  # A pergunta central (única, sem repetição)
  - quando: "troca a pergunta quem assina"
    ate_quando: "quem faz a peça"
    duracao: 4
    animacao:
      tipo: comparacao
      titulo: "O PONTO CRÍTICO"
      esquerda:
        titulo: "ANTES"
        itens: ["Máquina faz"]
      direita:
        titulo: "AGORA"
        itens: ["Quem faz?"]

  # ============================================================================
  # ANÁLISE DAS FASES (ÚNICA VEZ, SEM REPETIÇÕES)
  # ============================================================================

  - quando: "fase diagnóstico"
    ate_quando: "ninguém discute"
    duracao: 2
    animacao:
      tipo: texto
      texto: "FASE 1: DIAGNÓSTICO"
      subtitulo: "Consenso — IA é bem-vinda"
      tamanho: 100

  - quando: "fase de estratégia"
    ate_quando: "mora a reserva legal"
    duracao: 2
    animacao:
      tipo: texto
      texto: "FASE 2: ESTRATÉGIA ⚠️"
      subtitulo: "ZONA PROIBIDA — Escolher tese"
      tamanho: 100

  - quando: "fase de postulação"
    ate_quando: "assinatura digital"
    duracao: 2
    animacao:
      tipo: texto
      texto: "FASE 3: POSTULAÇÃO"
      subtitulo: "Responsabilidade do advogado"
      tamanho: 100

  # ============================================================================
  # O DILEMA CENTRAL
  # ============================================================================

  - quando: "sistema que propõe a tese"
    ate_quando: "apenas confirma"
    duracao: 2
    animacao:
      tipo: texto
      texto: "MÁQUINA PROPÕE"
      subtitulo: "Advogado apenas clica?"
      tamanho: 110

  - quando: "Responsabilidade sem decisão"
    duracao: 3
    layout: cheio
    zoom:
      fator: 1.2
    animacao:
      tipo: texto
      texto: "RESPONSABILIDADE\nSEM DECISÃO"
      subtitulo: "O cerne da ação da OAB"
      emoji: "⚠️"
      tamanho: 110

  # ============================================================================
  # ENCERRAMENTO - PERGUNTA FINAL
  # ============================================================================

  - quando: "quem que está decidindo de verdade"
    ate_quando: "assinador de peças"
    duracao: 3
    layout: cheio
    zoom:
      fator: 1.15
    animacao:
      tipo: texto
      texto: "E NO SEU\nESCRITÓRIO?"
      subtitulo: "Quem está decidindo de verdade?"
      emoji: "🤔"
      tamanho: 120
