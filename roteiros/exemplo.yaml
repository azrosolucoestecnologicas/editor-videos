# Roteiro de exemplo — usa o vídeo de demonstração (python exemplos/gerar_demo.py)
# Copie este arquivo para criar o roteiro de cada Reels.

video: entrada/demo.mp4
saida: saida/demo_editado.mp4

tema:
  fundo: ["#0b1020", "#1c2541"]   # gradiente do painel de animação
  destaque: "#facc15"             # amarelo das palavras em destaque
  secundaria: "#38bdf8"

legendas:
  ativas: true
  estilo: destaque        # destaque | caixa | simples
  palavras_por_bloco: 3
  maiusculas: true
  substituicoes:          # corrige palavras que a transcrição errar
    ia: IA

divisao:
  proporcao: 0.5          # fração da tela (de cima) para as animações
  animacao_em: cima       # cima | baixo
  foco_rosto: 0.33        # onde fica o rosto no vídeo original (0 = topo, 1 = base)
  transicao: 0.35         # segundos da animação de abrir/fechar a divisão

eventos:
  # 1) Frase de impacto quando eu falar "três erros"
  - quando: "três erros"
    ate_quando: "seu negócio"
    animacao:
      tipo: texto
      texto: "3 ERROS"
      subtitulo: "que travam o seu negócio"
      emoji: "🚨"

  # 2) Lista: cada item aparece quando eu falo dele
  - quando: "primeiro erro"
    ate_quando: "nunca testar nada"
    animacao:
      tipo: lista
      titulo: "OS 3 ERROS"
      numerada: true
      itens:
        - texto: "Não usar IA"
          quando: "inteligência artificial"
        - texto: "Ignorar os dados"
          quando: "ignorar"
        - texto: "Nunca testar"
          quando: "nunca testar"

  # 3) Contador de 0 a 300%
  - quando: "crescem até"
    duracao: 3.2
    animacao:
      tipo: contador
      de: 0
      ate: 300
      sufixo: "%"
      prefixo: "+"
      legenda: "mais rápido com IA"

  # 4) Zoom no rosto para dar ênfase (tela cheia)
  - quando: "trezentos por cento"
    duracao: 0.9
    layout: cheio
    zoom:
      fator: 1.2

  # 5) Comparação antes x depois
  - quando: "antes você"
    ate_quando: "faz por você"
    animacao:
      tipo: comparacao
      esquerda:
        titulo: "ANTES"
        itens: ["Tudo no braço", "Horas perdidas"]
      direita:
        titulo: "DEPOIS"
        itens: ["IA trabalhando", "Foco no que importa"]

  # 6) Ícone/emoji para a chamada final
  - quando: "comenta"
    ate_quando: "material"
    animacao:
      tipo: icone
      emoji: "💬"
      texto: "Comenta IA"
